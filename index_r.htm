<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotebookLM Article Review Prompt Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Inter & JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Document Parsers: Mammoth.js for DOCX and PDF.js for PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f4ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        },
                        notebook: {
                            teal: '#00897b',
                            blue: '#1a73e8',
                            purple: '#7c4dff',
                            darkBg: '#0f172a',
                            darkCard: '#1e293b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .code-font { font-family: 'JetBrains Mono', monospace; }
        /* Custom scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.6); }
        .dropzone-dash {
            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='16' ry='16' stroke='%236366F1FF' stroke-width='2' stroke-dasharray='8%2c 8' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Initialize PDF.js worker URL
        if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        // Article Types
        const ARTICLE_TYPES = [
            { id: 'academic', label: 'Academic & Research Paper', icon: 'fa-graduation-cap', desc: 'Methodology, peer-review standards, citations, scholarly rigor' },
            { id: 'blog', label: 'Blog & Content Marketing', icon: 'fa-blog', desc: 'Hook retention, SEO flow, conversational tone, clear CTA' },
            { id: 'tech_doc', label: 'Technical Article / Guide', icon: 'fa-code', desc: 'Accuracy, logical steps, code snippets, zero ambiguity' },
            { id: 'opinion', label: 'Opinion / Editorial Essay', icon: 'fa-newspaper', desc: 'Persuasive narrative, thesis strength, counterargument depth' },
            { id: 'business', label: 'Business Report / Case Study', icon: 'fa-chart-line', desc: 'Strategic insights, data backing, executive takeaways' },
            { id: 'general', label: 'General Non-Fiction Draft', icon: 'fa-file-lines', desc: 'Comprehensive structure, clarity, flow, and conciseness' }
        ];

        // Reviewer Personas
        const PERSONAS = [
            { id: 'strict_peer', label: 'Strict Peer Reviewer', desc: 'Rigorous, critical, demands evidence, highlights flaws candidly.' },
            { id: 'editor', label: 'Expert Senior Editor', desc: 'Balanced, structural, focuses on flow, narrative arc, and tone.' },
            { id: 'socratic', label: 'Socratic Writing Mentor', desc: 'Guides with probing questions, challenges assumptions constructively.' },
            { id: 'copywriter', label: 'Sharp Copy Editor', desc: 'Meticulous on conciseness, active voice, punchy hooks, line-editing.' },
            { id: 'layman', label: 'Target Reader Persona', desc: 'Evaluates accessibility, jargon, readability, and initial impression.' }
        ];

        // Review Focus Criteria
        const CRITERIA_OPTIONS = [
            { id: 'structure', label: 'Structure & Logical Flow', icon: 'fa-sitemap' },
            { id: 'clarity', label: 'Clarity & Conciseness', icon: 'fa-eye' },
            { id: 'arguments', label: 'Argument & Evidence Quality', icon: 'fa-scale-balanced' },
            { id: 'tone', label: 'Tone & Voice Alignment', icon: 'fa-sliders' },
            { id: 'hook', label: 'Introduction & Hook', icon: 'fa-magnet' },
            { id: 'conclusion', label: 'Conclusion & Key Takeaways', icon: 'fa-flag-checkered' },
            { id: 'fallacies', label: 'Logical Fallacies & Biases', icon: 'fa-triangle-exclamation' },
            { id: 'gaps', label: 'Missing Context & Unanswered Questions', icon: 'fa-circle-question' },
            { id: 'readability', label: 'Formatting & Visual Hierarchy', icon: 'fa-heading' }
        ];

        // NotebookLM Specific Enhancements
        const NOTEBOOKLM_FEATURES = [
            { id: 'source_quotes', label: 'Demand Direct Source Quotes', desc: 'Force feedback to reference exact text snippets' },
            { id: 'audio_prep', label: 'Format for Audio Overview', desc: 'Optimize feedback points for Audio Briefing podcasts' },
            { id: 'action_plan', label: 'Prioritized Action Plan', desc: 'Group suggestions into High / Medium / Low priority' },
            { id: 'rewrite_examples', label: 'Provide Before/After Rewrites', desc: 'Include concrete rewrite examples for problem sentences' },
            { id: 'table_summary', label: 'Summary Scorecard Table', desc: 'Include an executive evaluation table at the top' }
        ];

        // Helper to parse .docx files with Mammoth.js
        async function parseDocx(file) {
            const arrayBuffer = await file.arrayBuffer();
            const result = await window.mammoth.extractRawText({ arrayBuffer });
            return result.value || '';
        }

        // Helper to parse .pdf files with PDF.js
        async function parsePdf(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(' ');
                fullText += `--- Page ${i} ---\n` + pageText + '\n\n';
            }
            return fullText;
        }

        // Helper to read plain text, doc, markdown
        async function parseText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = (e) => reject(e);
                reader.readAsText(file);
            });
        }

        // Gemini API caller with backoff
        async function callGeminiAPI(prompt, systemInstruction = "", retries = 3, delay = 1000) {
            const apiKey = ""; // Canvas runtime provides authorization
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
            };

            if (systemInstruction) {
                payload.systemInstruction = { parts: [{ text: systemInstruction }] };
            }

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    const candidateText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (candidateText) {
                        return candidateText;
                    }
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(res => setTimeout(res, delay * Math.pow(2, i)));
                }
            }
            throw new Error('Failed to reach Gemini API.');
        }

        function App() {
            // Theme state
            const [darkMode, setDarkMode] = useState(true);
            const [activeTab, setActiveTab] = useState('builder'); // 'builder', 'upload', 'sandbox', 'saved', 'guide'
            const [toast, setToast] = useState(null);

            // Article Upload State
            const [uploadedFile, setUploadedFile] = useState(null); // { name, size, type, text, wordCount, readingTime }
            const [isParsingFile, setIsParsingFile] = useState(false);
            const [dragActive, setDragActive] = useState(false);

            // Prompt Configuration Inputs
            const [articleType, setArticleType] = useState('blog');
            const [persona, setPersona] = useState('editor');
            const [targetAudience, setTargetAudience] = useState('General Professional Audience');
            const [selectedCriteria, setSelectedCriteria] = useState(['hook', 'clarity', 'structure', 'arguments']);
            const [selectedFeatures, setSelectedFeatures] = useState(['source_quotes', 'action_plan', 'rewrite_examples']);
            const [customFocus, setCustomFocus] = useState('');
            const [wordLimitConstraint, setWordLimitConstraint] = useState('Comprehensive (500-800 words)');

            // Gemini Prompt Optimizer State
            const [isOptimizing, setIsOptimizing] = useState(false);
            const [enhancedPrompt, setEnhancedPrompt] = useState(null);
            const [useEnhanced, setUseEnhanced] = useState(false);

            // Saved Prompts Library
            const [savedPrompts, setSavedPrompts] = useState(() => {
                const local = localStorage.getItem('notebooklm_saved_prompts_v2');
                return local ? JSON.parse(local) : [];
            });

            // Sandbox state
            const [sandboxArticleText, setSandboxArticleText] = useState(`Title: The Future of Remote Work in the AI Era

In today's fast-paced world, remote work has become very popular. Many companies started allowing employees to work from home during the pandemic, and now it seems like a permanent trend. AI tools like ChatGPT and Zoom automations are making it even easier.

However, some managers still think remote work lowers productivity. They argue that employees get distracted at home by laundry or TVs. But studies show people actually work more hours at home. Additionally, AI helps automate administrative tasks so workers can focus on big projects.

In conclusion, remote work is definitely here to stay. Companies that don't adapt will lose top talent. Leaders should embrace AI and offer flexible hybrid models to stay competitive in 2026.`);
            const [sandboxOutput, setSandboxOutput] = useState('');
            const [isTestingSandbox, setIsTestingSandbox] = useState(false);

            // Sync dark mode class
            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            // Toast feedback
            const showToast = (message, type = 'info') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3200);
            };

            // Process uploaded document (.pdf, .docx, .doc, .txt, .md)
            const handleFileUpload = async (file) => {
                if (!file) return;
                setIsParsingFile(true);
                const fileName = file.name;
                const ext = fileName.split('.').pop().toLowerCase();

                try {
                    let extractedText = '';
                    if (ext === 'docx') {
                        extractedText = await parseDocx(file);
                    } else if (ext === 'pdf') {
                        extractedText = await parsePdf(file);
                    } else {
                        // .doc, .txt, .md, etc.
                        extractedText = await parseText(file);
                    }

                    const cleanText = extractedText.trim();
                    if (!cleanText) {
                        throw new Error('No readable text could be extracted from this file.');
                    }

                    const words = cleanText.split(/\s+/).filter(Boolean).length;
                    const readingTime = Math.ceil(words / 200);

                    const fileData = {
                        name: fileName,
                        size: (file.size / 1024).toFixed(1) + ' KB',
                        type: ext.toUpperCase(),
                        text: cleanText,
                        wordCount: words,
                        readingTime: `${readingTime} min read`
                    };

                    setUploadedFile(fileData);
                    setSandboxArticleText(cleanText);

                    // Detect article type heuristics
                    if (cleanText.toLowerCase().includes('abstract') || cleanText.toLowerCase().includes('references') || cleanText.toLowerCase().includes('methodology')) {
                        setArticleType('academic');
                    } else if (cleanText.toLowerCase().includes('code') || cleanText.toLowerCase().includes('function') || cleanText.toLowerCase().includes('api')) {
                        setArticleType('tech_doc');
                    } else if (cleanText.toLowerCase().includes('revenue') || cleanText.toLowerCase().includes('market') || cleanText.toLowerCase().includes('strategy')) {
                        setArticleType('business');
                    }

                    showToast(`Successfully extracted ${words} words from ${fileName}!`, 'success');
                } catch (err) {
                    console.error('File parsing error:', err);
                    showToast(`Error parsing file: ${err.message || 'Format unsupported or file unreadable.'}`, 'error');
                } finally {
                    setIsParsingFile(false);
                }
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                e.stopPropagation();
                setDragActive(true);
            };

            const handleDragLeave = (e) => {
                e.preventDefault();
                e.stopPropagation();
                setDragActive(false);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                e.stopPropagation();
                setDragActive(false);
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    handleFileUpload(e.dataTransfer.files[0]);
                }
            };

            // Toggle Criteria Pill
            const toggleCriteria = (id) => {
                if (selectedCriteria.includes(id)) {
                    setSelectedCriteria(selectedCriteria.filter(item => item !== id));
                } else {
                    setSelectedCriteria([...selectedCriteria, id]);
                }
            };

            // Toggle Feature Pill
            const toggleFeature = (id) => {
                if (selectedFeatures.includes(id)) {
                    setSelectedFeatures(selectedFeatures.filter(item => item !== id));
                } else {
                    setSelectedFeatures([...selectedFeatures, id]);
                }
            };

            // Dynamic Prompt Generator
            const rawGeneratedPrompt = useMemo(() => {
                const articleTypeObj = ARTICLE_TYPES.find(a => a.id === articleType);
                const personaObj = PERSONAS.find(p => p.id === persona);
                const criteriaObjs = CRITERIA_OPTIONS.filter(c => selectedCriteria.includes(c.id));

                let prompt = `Act as a **${personaObj?.label || 'Expert Reviewer'}** (${personaObj?.desc}).\n\n`;
                prompt += `Your goal is to thoroughly review the uploaded article titled "${uploadedFile ? uploadedFile.name : 'Uploaded Document'}" and provide precise, highly actionable feedback to help me revise and elevate the writing.\n\n`;

                prompt += `### **Target Audience Context**\n`;
                prompt += `The article is intended for: **${targetAudience || 'General Professional Readers'}**.\n\n`;

                prompt += `### **Core Review Pillars**\n`;
                prompt += `Focus your critique primarily on the following dimensions:\n`;
                criteriaObjs.forEach(c => {
                    prompt += `- **${c.label}**\n`;
                });
                prompt += `\n`;

                if (customFocus.trim()) {
                    prompt += `### **Specific Focus & Constraints**\n`;
                    prompt += `${customFocus.trim()}\n\n`;
                }

                prompt += `### **Google NotebookLM Source Grounding Directives**\n`;
                prompt += `1. **Strict Source Grounding:** Base all observations directly on the text uploaded in this notebook. Do not speculate or introduce unverified facts.\n`;
                
                if (selectedFeatures.includes('source_quotes')) {
                    prompt += `2. **Text Citations & Quotes:** Whenever pointing out an area for improvement, quote the specific sentence or paragraph from the article.\n`;
                }
                if (selectedFeatures.includes('rewrite_examples')) {
                    prompt += `3. **Concrete Rewrites:** For every major critique point, provide a clear 'Original Text vs. Suggested Rewrite' example.\n`;
                }
                if (selectedFeatures.includes('action_plan')) {
                    prompt += `4. **Prioritized Revision Checklist:** Group all recommended edits into High Priority (critical structural/clarity fixes), Medium Priority (flow/tone enhancements), and Low Priority (fine polishing).\n`;
                }
                if (selectedFeatures.includes('table_summary')) {
                    prompt += `5. **Executive Scorecard Table:** Begin your output with a Markdown summary table evaluating key parameters (Category, Rating 1-5 Stars, Core Finding).\n`;
                }
                if (selectedFeatures.includes('audio_prep')) {
                    prompt += `6. **Audio Overview Alignment:** Format takeaways into conversational, punchy bullet points ideal for discussion in NotebookLM's Audio Overview podcast feature.\n`;
                }

                prompt += `\n### **Output Format & Depth**\n`;
                prompt += `- **Tone:** Constructive, direct, authoritative, and structured.\n`;
                prompt += `- **Depth:** ${wordLimitConstraint}.\n`;
                prompt += `- **Layout:** Use clear headers, bold highlights, and formatted lists.\n\n`;

                prompt += `Begin your article review now using the uploaded source text.`;

                return prompt;
            }, [articleType, persona, targetAudience, selectedCriteria, selectedFeatures, customFocus, wordLimitConstraint, uploadedFile]);

            const finalPromptText = useMemo(() => {
                return (useEnhanced && enhancedPrompt) ? enhancedPrompt : rawGeneratedPrompt;
            }, [useEnhanced, enhancedPrompt, rawGeneratedPrompt]);

            // Call Gemini API to enhance prompt
            const handleEnhancePrompt = async () => {
                setIsOptimizing(true);
                try {
                    const sysInst = "You are an expert AI Prompt Engineer specializing in Google NotebookLM grounded document analysis. Transform the user's base prompt into a hyper-structured, high-performance NotebookLM prompt system instruction.";
                    
                    const userQuery = `Optimize this prompt for reviewing an uploaded article in Google NotebookLM:\n\n---\n${rawGeneratedPrompt}\n---`;

                    const resultText = await callGeminiAPI(userQuery, sysInst);
                    setEnhancedPrompt(resultText);
                    setUseEnhanced(true);
                    showToast('Prompt optimized with Gemini for NotebookLM!', 'success');
                } catch (err) {
                    console.error(err);
                    showToast('Failed to optimize prompt. Check network connection.', 'error');
                } finally {
                    setIsOptimizing(false);
                }
            };

            // Copy Prompt to Clipboard
            const handleCopyPrompt = () => {
                try {
                    const textArea = document.createElement('textarea');
                    textArea.value = finalPromptText;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    showToast('Copied prompt to clipboard!', 'success');
                } catch (e) {
                    showToast('Could not copy prompt automatically.', 'error');
                }
            };

            // Save Prompt
            const handleSavePrompt = () => {
                const title = prompt('Enter a name for this saved prompt:', `${uploadedFile ? uploadedFile.name : ARTICLE_TYPES.find(a=>a.id===articleType)?.label} Review Prompt`);
                if (!title) return;

                const newSavedItem = {
                    id: Date.now(),
                    title,
                    text: finalPromptText,
                    fileName: uploadedFile ? uploadedFile.name : 'No file attached',
                    createdAt: new Date().toLocaleDateString()
                };

                const updated = [newSavedItem, ...savedPrompts];
                setSavedPrompts(updated);
                localStorage.setItem('notebooklm_saved_prompts_v2', JSON.stringify(updated));
                showToast('Saved to Prompt Library!', 'success');
            };

            // Delete Saved Prompt
            const handleDeleteSaved = (id) => {
                const updated = savedPrompts.filter(p => p.id !== id);
                setSavedPrompts(updated);
                localStorage.setItem('notebooklm_saved_prompts_v2', JSON.stringify(updated));
                showToast('Deleted prompt from library.', 'info');
            };

            // Execute Sandbox AI Simulation
            const handleRunSandbox = async () => {
                if (!sandboxArticleText.trim()) {
                    showToast('Please upload an article file or paste article text first.', 'warning');
                    return;
                }
                setIsTestingSandbox(true);
                setSandboxOutput('');

                try {
                    const sysPrompt = "You are Google NotebookLM executing a grounded article critique on an uploaded document source.";
                    const query = `[DOCUMENT SOURCE START]\n${sandboxArticleText}\n[DOCUMENT SOURCE END]\n\nUSER PROMPT:\n${finalPromptText}`;

                    const reviewResult = await callGeminiAPI(query, sysPrompt);
                    setSandboxOutput(reviewResult);
                    showToast('Article review simulation complete!', 'success');
                } catch (err) {
                    console.error(err);
                    showToast('Error generating review simulation.', 'error');
                } finally {
                    setIsTestingSandbox(false);
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Navigation Header */}
                    <header className="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 via-indigo-500 to-teal-400 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
                                    <i className="fa-solid fa-feather-pointed text-lg"></i>
                                </div>
                                <div>
                                    <h1 className="font-extrabold text-lg leading-tight tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
                                        NotebookLM Prompt Studio
                                        <span className="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-indigo-100 dark:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800">
                                            Article Review
                                        </span>
                                    </h1>
                                    <p className="text-xs text-slate-500 dark:text-slate-400">Generate article review prompts tailored for Google NotebookLM</p>
                                </div>
                            </div>

                            {/* Desktop Nav Tabs */}
                            <nav className="hidden md:flex items-center space-x-1 bg-slate-100 dark:bg-slate-800/80 p-1 rounded-xl text-xs font-medium">
                                <button 
                                    onClick={() => setActiveTab('builder')}
                                    className={`px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-all ${activeTab === 'builder' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'}`}>
                                    <i className="fa-solid fa-wand-magic-sparkles text-brand-500"></i> Prompt Builder
                                </button>
                                <button 
                                    onClick={() => setActiveTab('sandbox')}
                                    className={`px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-all ${activeTab === 'sandbox' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'}`}>
                                    <i className="fa-solid fa-flask text-indigo-500"></i> Review Sandbox
                                </button>
                                <button 
                                    onClick={() => setActiveTab('saved')}
                                    className={`px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-all ${activeTab === 'saved' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'}`}>
                                    <i className="fa-solid fa-bookmark text-teal-500"></i> Saved Prompts ({savedPrompts.length})
                                </button>
                                <button 
                                    onClick={() => setActiveTab('guide')}
                                    className={`px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-all ${activeTab === 'guide' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'}`}>
                                    <i className="fa-solid fa-book-open text-amber-500"></i> NotebookLM Workflow Guide
                                </button>
                            </nav>

                            {/* Theme Toggle */}
                            <div className="flex items-center space-x-2">
                                <button
                                    onClick={() => setDarkMode(!darkMode)}
                                    className="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
                                    title="Toggle Light / Dark Mode">
                                    <i className={`fa-solid ${darkMode ? 'fa-sun text-amber-400' : 'fa-moon text-slate-600'}`}></i>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Toast Alert */}
                    {toast && (
                        <div className="fixed bottom-5 right-5 z-50 flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-xl border bg-slate-900 text-white border-slate-700 text-xs font-medium animate-bounce">
                            <i className={`fa-solid ${toast.type === 'success' ? 'fa-circle-check text-emerald-400' : toast.type === 'error' ? 'fa-circle-xmark text-rose-400' : 'fa-circle-info text-sky-400'}`}></i>
                            <span>{toast.message}</span>
                        </div>
                    )}

                    {/* Global Upload Zone Header Banner */}
                    <div className="bg-gradient-to-r from-brand-900/30 via-indigo-900/20 to-slate-900/40 border-b border-indigo-500/20 py-4 px-4 sm:px-6 lg:px-8">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
                            
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-xl bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 flex items-center justify-center">
                                    <i className="fa-solid fa-file-arrow-up text-lg"></i>
                                </div>
                                <div>
                                    <h3 className="text-sm font-bold text-white flex items-center gap-2">
                                        Upload Article Document
                                        <span className="text-[10px] font-normal px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
                                            .pdf &bull; .docx &bull; .doc &bull; .txt
                                        </span>
                                    </h3>
                                    <p className="text-xs text-slate-400">Upload your article draft to extract text metrics and auto-tune prompt parameters.</p>
                                </div>
                            </div>

                            {/* Active Upload Status or Dropzone Button */}
                            {uploadedFile ? (
                                <div className="flex items-center gap-3 bg-slate-800/90 border border-emerald-500/40 rounded-xl p-2 px-3">
                                    <div className="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xs">
                                        {uploadedFile.type}
                                    </div>
                                    <div className="text-left">
                                        <div className="text-xs font-bold text-white max-w-[180px] truncate">{uploadedFile.name}</div>
                                        <div className="text-[10px] text-slate-400">{uploadedFile.wordCount} words &bull; {uploadedFile.readingTime}</div>
                                    </div>
                                    <button 
                                        onClick={() => { setUploadedFile(null); setSandboxArticleText(''); }}
                                        className="text-slate-400 hover:text-rose-400 text-xs p-1 ml-2">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                            ) : (
                                <div 
                                    onDragOver={handleDragOver}
                                    onDragLeave={handleDragLeave}
                                    onDrop={handleDrop}
                                    className={`relative flex items-center gap-3 px-4 py-2.5 rounded-xl border transition-all cursor-pointer ${dragActive ? 'bg-indigo-600/30 border-indigo-400' : 'bg-slate-800/60 hover:bg-slate-800 border-slate-700'}`}>
                                    <input 
                                        type="file" 
                                        accept=".pdf,.docx,.doc,.txt,.md" 
                                        onChange={(e) => e.target.files?.[0] && handleFileUpload(e.target.files[0])} 
                                        className="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                                    />
                                    {isParsingFile ? (
                                        <div className="flex items-center gap-2 text-xs text-indigo-300 font-medium">
                                            <i className="fa-solid fa-spinner animate-spin"></i>
                                            Extracting document text...
                                        </div>
                                    ) : (
                                        <div className="flex items-center gap-2 text-xs text-slate-200">
                                            <i className="fa-solid fa-cloud-arrow-up text-brand-400 text-sm"></i>
                                            <span className="font-semibold">Click or Drop Article File</span>
                                        </div>
                                    )}
                                </div>
                            )}

                        </div>
                    </div>

                    {/* Main Workspace Area */}
                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
                        
                        {/* Mobile Navigation Tabs */}
                        <div className="md:hidden flex mb-6 overflow-x-auto p-1 bg-slate-200 dark:bg-slate-800 rounded-xl text-xs font-medium space-x-1">
                            <button onClick={() => setActiveTab('builder')} className={`flex-1 py-2 px-3 rounded-lg text-center whitespace-nowrap ${activeTab === 'builder' ? 'bg-white dark:bg-slate-700 font-semibold' : ''}`}>Builder</button>
                            <button onClick={() => setActiveTab('sandbox')} className={`flex-1 py-2 px-3 rounded-lg text-center whitespace-nowrap ${activeTab === 'sandbox' ? 'bg-white dark:bg-slate-700 font-semibold' : ''}`}>Sandbox</button>
                            <button onClick={() => setActiveTab('saved')} className={`flex-1 py-2 px-3 rounded-lg text-center whitespace-nowrap ${activeTab === 'saved' ? 'bg-white dark:bg-slate-700 font-semibold' : ''}`}>Saved ({savedPrompts.length})</button>
                            <button onClick={() => setActiveTab('guide')} className={`flex-1 py-2 px-3 rounded-lg text-center whitespace-nowrap ${activeTab === 'guide' ? 'bg-white dark:bg-slate-700 font-semibold' : ''}`}>Guide</button>
                        </div>

                        {/* TAB 1: PROMPT BUILDER */}
                        {activeTab === 'builder' && (
                            <div className="space-y-6">
                                
                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                                    {/* Left Column: Configuration Controls */}
                                    <div className="lg:col-span-7 space-y-6">
                                        
                                        {/* Step 1: Article Type */}
                                        <div className="bg-white dark:bg-slate-800/80 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                                            <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-400 mb-3 flex items-center gap-2">
                                                <span className="w-5 h-5 rounded-full bg-brand-500 text-white text-[10px] flex items-center justify-center font-bold">1</span>
                                                Article Genre & Format
                                            </h2>
                                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                                                {ARTICLE_TYPES.map((type) => (
                                                    <button
                                                        key={type.id}
                                                        onClick={() => setArticleType(type.id)}
                                                        className={`p-3 rounded-xl text-left border text-xs transition-all flex flex-col justify-between ${
                                                            articleType === type.id
                                                                ? 'border-brand-500 bg-brand-50/50 dark:bg-brand-950/40 text-brand-700 dark:text-brand-300 ring-2 ring-brand-500/20 font-semibold'
                                                                : 'border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600 text-slate-700 dark:text-slate-300'
                                                        }`}>
                                                        <i className={`fa-solid ${type.icon} text-base mb-2 ${articleType === type.id ? 'text-brand-500' : 'text-slate-400'}`}></i>
                                                        <div>
                                                            <div className="font-semibold mb-0.5">{type.label}</div>
                                                            <div className="text-[10px] text-slate-400 line-clamp-1">{type.desc}</div>
                                                        </div>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Step 2: Reviewer Persona & Audience */}
                                        <div className="bg-white dark:bg-slate-800/80 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                                            <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-400 flex items-center gap-2">
                                                <span className="w-5 h-5 rounded-full bg-brand-500 text-white text-[10px] flex items-center justify-center font-bold">2</span>
                                                Reviewer Persona & Target Readers
                                            </h2>
                                            
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-2">Reviewer Persona</label>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                    {PERSONAS.map((p) => (
                                                        <button
                                                            key={p.id}
                                                            onClick={() => setPersona(p.id)}
                                                            className={`p-2.5 rounded-xl text-left border text-xs transition-all ${
                                                                persona === p.id
                                                                    ? 'border-brand-500 bg-brand-50/50 dark:bg-brand-950/40 text-brand-700 dark:text-brand-300 ring-1 ring-brand-500'
                                                                    : 'border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300'
                                                            }`}>
                                                            <div className="font-semibold">{p.label}</div>
                                                            <div className="text-[10px] text-slate-400">{p.desc}</div>
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Target Audience Profile</label>
                                                <input
                                                    type="text"
                                                    value={targetAudience}
                                                    onChange={(e) => setTargetAudience(e.target.value)}
                                                    placeholder="e.g. C-Suite Executives, Academic Peers, Technical Engineers"
                                                    className="w-full px-3 py-2 rounded-xl text-xs border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500"
                                                />
                                            </div>
                                        </div>

                                        {/* Step 3: Review Focus Pillars */}
                                        <div className="bg-white dark:bg-slate-800/80 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                                            <div className="flex items-center justify-between mb-3">
                                                <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-400 flex items-center gap-2">
                                                    <span className="w-5 h-5 rounded-full bg-brand-500 text-white text-[10px] flex items-center justify-center font-bold">3</span>
                                                    Critique Focus Criteria
                                                </h2>
                                                <span className="text-[11px] text-slate-400">{selectedCriteria.length} selected</span>
                                            </div>
                                            
                                            <div className="flex flex-wrap gap-2">
                                                {CRITERIA_OPTIONS.map((item) => {
                                                    const isSelected = selectedCriteria.includes(item.id);
                                                    return (
                                                        <button
                                                            key={item.id}
                                                            onClick={() => toggleCriteria(item.id)}
                                                            className={`px-3 py-1.5 rounded-xl text-xs font-medium border transition-all flex items-center gap-2 ${
                                                                isSelected
                                                                    ? 'bg-brand-500 text-white border-brand-500 shadow-sm'
                                                                    : 'bg-slate-50 dark:bg-slate-900/60 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-slate-300'
                                                            }`}>
                                                            <i className={`fa-solid ${item.icon} text-[10px]`}></i>
                                                            {item.label}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>

                                        {/* Step 4: NotebookLM Features */}
                                        <div className="bg-white dark:bg-slate-800/80 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                                            <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-400 flex items-center gap-2">
                                                <span className="w-5 h-5 rounded-full bg-brand-500 text-white text-[10px] flex items-center justify-center font-bold">4</span>
                                                NotebookLM Rules & Formatting
                                            </h2>

                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                {NOTEBOOKLM_FEATURES.map((feat) => {
                                                    const active = selectedFeatures.includes(feat.id);
                                                    return (
                                                        <button
                                                            key={feat.id}
                                                            onClick={() => toggleFeature(feat.id)}
                                                            className={`p-2.5 rounded-xl text-left border text-xs transition-all flex items-start gap-2.5 ${
                                                                active
                                                                    ? 'border-teal-500 bg-teal-50/40 dark:bg-teal-950/30 text-teal-900 dark:text-teal-200 ring-1 ring-teal-500'
                                                                    : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'
                                                            }`}>
                                                            <div className={`mt-0.5 w-4 h-4 rounded flex items-center justify-center text-[10px] border ${active ? 'bg-teal-500 text-white border-teal-500' : 'border-slate-300 dark:border-slate-600'}`}>
                                                                {active && <i className="fa-solid fa-check"></i>}
                                                            </div>
                                                            <div>
                                                                <div className="font-semibold">{feat.label}</div>
                                                                <div className="text-[10px] opacity-80">{feat.desc}</div>
                                                            </div>
                                                        </button>
                                                    );
                                                })}
                                            </div>

                                            <div>
                                                <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Custom Notes or Specific Questions (Optional)</label>
                                                <textarea
                                                    rows="2"
                                                    value={customFocus}
                                                    onChange={(e) => setCustomFocus(e.target.value)}
                                                    placeholder="e.g. Check if the argument in paragraph 3 is supported by evidence in the document."
                                                    className="w-full p-2.5 rounded-xl text-xs border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500"
                                                ></textarea>
                                            </div>
                                        </div>

                                    </div>

                                    {/* Right Column: Dynamic Prompt Output Panel */}
                                    <div className="lg:col-span-5 lg:sticky lg:top-20 space-y-4">
                                        <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-xl overflow-hidden flex flex-col">
                                            
                                            {/* Panel Header */}
                                            <div className="px-4 py-3 bg-slate-100 dark:bg-slate-900/90 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
                                                <div className="flex items-center space-x-2">
                                                    <span className="w-3 h-3 rounded-full bg-rose-500 inline-block"></span>
                                                    <span className="w-3 h-3 rounded-full bg-amber-500 inline-block"></span>
                                                    <span className="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
                                                    <span className="text-xs font-bold text-slate-600 dark:text-slate-300 ml-2">NotebookLM Review Prompt</span>
                                                </div>
                                                
                                                {useEnhanced && (
                                                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-teal-500/20 text-teal-600 dark:text-teal-300 font-bold flex items-center gap-1">
                                                        <i className="fa-solid fa-wand-magic-sparkles"></i> Gemini Optimized
                                                    </span>
                                                )}
                                            </div>

                                            {/* Code Preview */}
                                            <div className="p-4 bg-slate-950 text-slate-100 code-font text-xs leading-relaxed max-h-[460px] overflow-y-auto whitespace-pre-wrap select-all border-b border-slate-800">
                                                {finalPromptText}
                                            </div>

                                            {/* Action Toolbar */}
                                            <div className="p-3 bg-slate-50 dark:bg-slate-800/90 flex flex-wrap items-center justify-between gap-2">
                                                {enhancedPrompt && (
                                                    <button
                                                        onClick={() => setUseEnhanced(!useEnhanced)}
                                                        className="text-xs px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 font-medium transition">
                                                        {useEnhanced ? 'Show Raw' : 'Show Enhanced'}
                                                    </button>
                                                )}

                                                <div className="flex items-center space-x-2 ml-auto">
                                                    <button
                                                        onClick={handleSavePrompt}
                                                        className="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-300 dark:hover:bg-slate-600 transition flex items-center gap-1.5">
                                                        <i className="fa-solid fa-bookmark"></i> Save
                                                    </button>
                                                    <button
                                                        onClick={handleCopyPrompt}
                                                        className="px-4 py-1.5 rounded-xl text-xs font-bold bg-brand-600 hover:bg-brand-700 text-white shadow-md shadow-brand-500/20 transition flex items-center gap-1.5">
                                                        <i className="fa-solid fa-copy"></i> Copy Prompt
                                                    </button>
                                                </div>
                                            </div>

                                            {/* Gemini Optimizer Banner */}
                                            <div className="p-4 bg-gradient-to-br from-indigo-900/50 via-purple-900/30 to-slate-900 border-t border-indigo-500/20">
                                                <div className="flex items-center justify-between">
                                                    <div>
                                                        <h4 className="text-xs font-bold text-white flex items-center gap-1.5">
                                                            <i className="fa-solid fa-wand-magic-sparkles text-amber-400"></i>
                                                            Gemini Prompt Optimizer
                                                        </h4>
                                                        <p className="text-[11px] text-indigo-200/80">Refine using Gemini 3 Flash for maximum NotebookLM performance.</p>
                                                    </div>
                                                    <button
                                                        onClick={handleEnhancePrompt}
                                                        disabled={isOptimizing}
                                                        className="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-gradient-to-r from-amber-500 to-indigo-600 hover:from-amber-600 hover:to-indigo-700 text-white shadow-md transition disabled:opacity-50 flex items-center gap-1.5">
                                                        {isOptimizing ? (
                                                            <>
                                                                <i className="fa-solid fa-spinner animate-spin"></i> Optimizing...
                                                            </>
                                                        ) : (
                                                            <>✨ Optimize</>
                                                        )}
                                                    </button>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Sandbox CTA */}
                                        <div className="bg-emerald-500/10 border border-emerald-500/30 rounded-2xl p-4 flex items-center justify-between text-xs text-emerald-800 dark:text-emerald-300">
                                            <div className="flex items-center gap-2">
                                                <i className="fa-solid fa-flask text-base text-emerald-500"></i>
                                                <span>Test prompt on your article text in AI Sandbox</span>
                                            </div>
                                            <button 
                                                onClick={() => setActiveTab('sandbox')}
                                                className="px-3 py-1.5 rounded-lg font-bold bg-emerald-600 text-white hover:bg-emerald-700 transition whitespace-nowrap">
                                                Test in Sandbox &rarr;
                                            </button>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: REVIEW SANDBOX */}
                        {activeTab === 'sandbox' && (
                            <div className="space-y-6">
                                <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4 pb-4 border-b border-slate-200 dark:border-slate-700">
                                        <div>
                                            <h2 className="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                                                <i className="fa-solid fa-flask text-indigo-500"></i>
                                                NotebookLM Review Simulator
                                            </h2>
                                            <p className="text-xs text-slate-500 dark:text-slate-400">
                                                Simulate how Google NotebookLM will critique your uploaded article using your current prompt.
                                            </p>
                                        </div>
                                        
                                        {uploadedFile && (
                                            <div className="text-xs text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 px-3 py-1.5 rounded-xl flex items-center gap-2">
                                                <i className="fa-solid fa-file-lines text-indigo-400"></i>
                                                <span>Loaded: <b>{uploadedFile.name}</b> ({uploadedFile.wordCount} words)</span>
                                            </div>
                                        )}
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                        {/* Article Text Source */}
                                        <div className="space-y-2">
                                            <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 flex items-center justify-between">
                                                <span>1. Extracted Article Text</span>
                                                <span className="text-[10px] text-slate-400 font-normal">Editable</span>
                                            </label>
                                            <textarea
                                                rows="15"
                                                value={sandboxArticleText}
                                                onChange={(e) => setSandboxArticleText(e.target.value)}
                                                className="w-full p-4 text-xs font-sans rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 leading-relaxed"
                                                placeholder="Paste or upload your article text..."
                                            ></textarea>
                                        </div>

                                        {/* Simulated NotebookLM Output */}
                                        <div className="space-y-2">
                                            <div className="flex items-center justify-between">
                                                <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                                                    2. Simulated NotebookLM Feedback
                                                </label>
                                                <button
                                                    onClick={handleRunSandbox}
                                                    disabled={isTestingSandbox}
                                                    className="px-4 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 hover:bg-indigo-700 text-white shadow-md disabled:opacity-50 transition flex items-center gap-2">
                                                    {isTestingSandbox ? (
                                                        <>
                                                            <i className="fa-solid fa-spinner animate-spin"></i> Generating Feedback...
                                                        </>
                                                    ) : (
                                                        <>
                                                            <i className="fa-solid fa-play"></i> Run Simulation
                                                        </>
                                                    )}
                                                </button>
                                            </div>

                                            <div className="w-full h-[320px] lg:h-[370px] p-4 text-xs font-sans rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-950 text-slate-100 overflow-y-auto leading-relaxed whitespace-pre-wrap">
                                                {sandboxOutput ? (
                                                    sandboxOutput
                                                ) : (
                                                    <div className="h-full flex flex-col items-center justify-center text-center text-slate-500 p-6">
                                                        <i className="fa-solid fa-wand-magic-sparkles text-3xl mb-3 text-slate-600"></i>
                                                        <p className="font-semibold text-slate-400 mb-1">No feedback generated yet</p>
                                                        <p className="text-[11px] max-w-xs">Click "Run Simulation" to execute your current prompt against the uploaded document.</p>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 3: SAVED PROMPTS LIBRARY */}
                        {activeTab === 'saved' && (
                            <div className="space-y-6">
                                <div className="flex items-center justify-between">
                                    <h2 className="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                                        <i className="fa-solid fa-bookmark text-teal-500"></i> Saved Prompt Library
                                    </h2>
                                    <span className="text-xs text-slate-500">{savedPrompts.length} custom prompts saved</span>
                                </div>

                                {savedPrompts.length === 0 ? (
                                    <div className="bg-white dark:bg-slate-800 rounded-2xl p-12 text-center border border-slate-200 dark:border-slate-700">
                                        <i className="fa-solid fa-folder-open text-4xl text-slate-300 dark:text-slate-600 mb-3"></i>
                                        <h3 className="font-semibold text-slate-700 dark:text-slate-200">No saved prompts yet</h3>
                                        <p className="text-xs text-slate-400 mt-1 mb-4">Build review prompts for your articles and save them here for quick access.</p>
                                        <button 
                                            onClick={() => setActiveTab('builder')}
                                            className="px-4 py-2 bg-brand-600 text-white text-xs font-bold rounded-xl shadow">
                                            Go to Builder &rarr;
                                        </button>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {savedPrompts.map((item) => (
                                            <div key={item.id} className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-between space-y-4">
                                                <div>
                                                    <div className="flex items-center justify-between mb-2">
                                                        <h3 className="font-bold text-sm text-slate-900 dark:text-white">{item.title}</h3>
                                                        <span className="text-[10px] text-slate-400">{item.createdAt}</span>
                                                    </div>
                                                    <div className="text-[10px] text-slate-400 mb-2">Source document: <span className="font-medium text-slate-300">{item.fileName}</span></div>
                                                    <div className="p-3 bg-slate-950 text-slate-300 code-font text-[11px] rounded-xl max-h-36 overflow-y-auto whitespace-pre-wrap">
                                                        {item.text}
                                                    </div>
                                                </div>
                                                <div className="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-700">
                                                    <button
                                                        onClick={() => {
                                                            navigator.clipboard.writeText(item.text);
                                                            showToast('Copied to clipboard!', 'success');
                                                        }}
                                                        className="text-xs font-semibold text-brand-600 dark:text-brand-400 hover:underline flex items-center gap-1">
                                                        <i className="fa-solid fa-copy"></i> Copy Prompt
                                                    </button>
                                                    <button
                                                        onClick={() => handleDeleteSaved(item.id)}
                                                        className="text-xs text-rose-500 hover:text-rose-700 font-medium">
                                                        <i className="fa-solid fa-trash-can"></i> Delete
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* TAB 4: NOTEBOOKLM WORKFLOW GUIDE */}
                        {activeTab === 'guide' && (
                            <div className="max-w-4xl mx-auto space-y-6">
                                <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-6">
                                    <div className="border-b border-slate-200 dark:border-slate-700 pb-4">
                                        <h2 className="text-xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
                                            <i className="fa-solid fa-book-open text-amber-500"></i>
                                            How to Use Prompts in Google NotebookLM
                                        </h2>
                                        <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                                            A step-by-step workflow to get the most accurate article reviews using Google's grounded document environment.
                                        </p>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        
                                        <div className="space-y-2">
                                            <div className="w-8 h-8 rounded-lg bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-300 flex items-center justify-center font-bold text-sm">1</div>
                                            <h3 className="font-bold text-sm text-slate-800 dark:text-slate-100">Upload Article to NotebookLM</h3>
                                            <p className="text-xs text-slate-600 dark:text-slate-400 leading-relaxed">
                                                Open <a href="https://notebooklm.google.com" target="_blank" rel="noreferrer" className="text-brand-500 underline font-semibold">Google NotebookLM</a>, create a notebook, and upload your article file (.pdf, .docx, or Google Doc) as a Source.
                                            </p>
                                        </div>

                                        <div className="space-y-2">
                                            <div className="w-8 h-8 rounded-lg bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-300 flex items-center justify-center font-bold text-sm">2</div>
                                            <h3 className="font-bold text-sm text-slate-800 dark:text-slate-100">Paste Generated Prompt into Chat</h3>
                                            <p className="text-xs text-slate-600 dark:text-slate-400 leading-relaxed">
                                                Copy the prompt generated in this studio and paste it directly into the NotebookLM chat bar. Ensure your article source checkbox is enabled.
                                            </p>
                                        </div>

                                        <div className="space-y-2">
                                            <div className="w-8 h-8 rounded-lg bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-300 flex items-center justify-center font-bold text-sm">3</div>
                                            <h3 className="font-bold text-sm text-slate-800 dark:text-slate-100">Pin Feedback as Notes</h3>
                                            <p className="text-xs text-slate-600 dark:text-slate-400 leading-relaxed">
                                                When NotebookLM produces the Scorecard and Revision Checklist, click "Save to Note" so you can refer to it while editing your article draft.
                                            </p>
                                        </div>

                                        <div className="space-y-2">
                                            <div className="w-8 h-8 rounded-lg bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-300 flex items-center justify-center font-bold text-sm">4</div>
                                            <h3 className="font-bold text-sm text-slate-800 dark:text-slate-100">Listen via Audio Overview</h3>
                                            <p className="text-xs text-slate-600 dark:text-slate-400 leading-relaxed">
                                                Generate an Audio Overview (podcast format) in NotebookLM. Hearing two AI hosts discuss your article's structural issues helps uncover weak hooks and missing logical steps.
                                            </p>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* Footer */}
                    <footer className="mt-auto border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-4 text-center text-xs text-slate-500 dark:text-slate-400">
                        <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
                            <div>NotebookLM Article Review Prompt Studio &bull; Document Parsing (.pdf, .docx, .doc) Enabled</div>
                            <div className="flex items-center space-x-4">
                                <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-emerald-500"></span> Gemini 3 Flash Powered</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
